<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>DNA // CYBER TERMINAL MATRIX</title>
<style>
  :root{
    --bg:#05070b;
    --text:#e8fbff;
    --soft:#93b7c7;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#020307;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  body{background:radial-gradient(circle at 50% 18%,#0c111c 0,#06080d 44%,#020307 100%)}
  #screen{position:fixed;inset:0;width:100%;height:100%;display:block}
  .toolbar{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:10}
  .tool{
    appearance:none;border:1px solid rgba(146,244,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    color:#edfdff;border-radius:999px;padding:9px 12px;font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.06em;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.22)
  }
  .tool:hover{transform:translateY(-1px)}
  .modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,8,14,0);backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:.22s ease;z-index:20}
  .modal.show{opacity:1;pointer-events:auto;background:rgba(1,8,14,.62);backdrop-filter:blur(10px)}
  .modal::before,.modal::after{content:"";position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .22s ease}
  .modal::before{width:42vw;height:42vw;max-width:620px;max-height:620px;left:8%;top:8%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.14),rgba(111,247,255,.07) 28%,rgba(255,255,255,0) 62%)}
  .modal::after{width:28vw;height:28vw;max-width:420px;max-height:420px;right:10%;bottom:12%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.12),rgba(255,88,215,.05) 30%,rgba(255,255,255,0) 64%)}
  .modal.show::before,.modal.show::after{opacity:1;animation:lensFloat 13s ease-in-out infinite}
  .modal.show::after{animation-duration:16s;animation-direction:alternate}
  @keyframes lensFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-12px) scale(1.03)}}
  .dialog{width:min(820px,calc(100vw - 32px));max-height:84vh;overflow:auto;border-radius:28px;border:1px solid rgba(146,244,255,.18);background:linear-gradient(180deg,rgba(7,14,21,.94),rgba(5,10,15,.90));padding:22px;position:relative;box-shadow:0 30px 120px rgba(0,0,0,.55),0 0 70px rgba(111,247,255,.07);transform:translateY(16px) scale(.98);opacity:0;transition:.22s ease}
  .modal.show .dialog{transform:none;opacity:1}
  .dialog::before{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 34%,rgba(255,255,255,0) 72%),radial-gradient(circle at 12% 10%,rgba(255,255,255,.12),rgba(255,255,255,0) 22%),radial-gradient(circle at 88% 12%,rgba(111,247,255,.08),rgba(255,255,255,0) 24%)}
  .dialog > *{position:relative;z-index:1}
  .dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .dialog h2{margin:0;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
  .close{appearance:none;border:1px solid rgba(146,244,255,.18);background:rgba(255,255,255,.05);color:#edfdff;border-radius:999px;padding:9px 13px;font:700 11px ui-monospace,Consolas,monospace;cursor:pointer}
  .dialog p{color:#bdd0db;line-height:1.62;margin:12px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cell{padding:12px;border-radius:16px;border:1px solid rgba(146,244,255,.12);background:rgba(255,255,255,.02)}
  .cell b{display:block;font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#7df2ff;margin-bottom:6px}
  .cell span{font:11px/1.5 ui-monospace,Consolas,monospace;color:#d6e8ef}
  .list{list-style:none;margin:16px 0 0;padding:0}
  .list li{padding:8px 0;border-bottom:1px solid rgba(146,244,255,.08);font:11px ui-monospace,Consolas,monospace;color:#d8e7ef}
  .list li::before{content:"◇ ";color:#ffd56d}
  @media (max-width:720px){ .grid{grid-template-columns:1fr} .toolbar{top:auto;bottom:10px;right:10px;flex-wrap:wrap;max-width:90vw;justify-content:flex-end} }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="toolbar">
  <button class="tool" id="themeBtn">THEME</button>
  <button class="tool" id="burstBtn">BURST</button>
  <button class="tool" id="pauseBtn">PAUSE</button>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog">
    <header>
      <h2 id="modalTitle">Panel Detail</h2>
      <button class="close" id="closeModal">CLOSE</button>
    </header>
    <p id="modalText"></p>
    <div class="grid" id="modalGrid"></div>
    <ul class="list" id="modalList"></ul>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalGrid = document.getElementById('modalGrid');
  const modalList = document.getElementById('modalList');
  const pauseBtn = document.getElementById('pauseBtn');

  const themes = [
    {name:'CYBER NEON', bg:'#06080d', panel:'rgba(8,12,18,.82)', line:'#72f7ff', line2:'#ff58d7', line3:'#ffd56d', soft:'#93b7c7', edge:'#e9feff'},
    {name:'MINT OPS', bg:'#05080a', panel:'rgba(7,12,13,.82)', line:'#8bffe3', line2:'#7db8ff', line3:'#ffe593', soft:'#a9cec9', edge:'#efffff'},
    {name:'CRIMSON ARC', bg:'#08060a', panel:'rgba(12,8,13,.84)', line:'#ff77a8', line2:'#77d2ff', line3:'#ffcc76', soft:'#ceb6c8', edge:'#fff6fb'}
  ];

  const state = {
    theme:0,
    paused:false,
    burst:0,
    W:0,H:0,tPrev:performance.now(),
    tickerX:0,
    layout:[],
    hitRegions:[],
    queueHistory:Array.from({length:64},()=>120+Math.random()*22),
    latencyHistory:Array.from({length:64},()=>34+Math.random()*8),
    spectrum:Array.from({length:28},()=>.2+Math.random()*0.7),
    heat:Array.from({length:8},()=>Array.from({length:16},()=>Math.random())),
    termLines:[],
    particles:[],
    workerBlips:Array.from({length:12},(_,i)=>({a:Math.random()*Math.PI*2,r:.15+Math.random()*.5,s:.0025+Math.random()*.004})),
    topology:Array.from({length:18},()=>({x:.15+Math.random()*.7,y:.18+Math.random()*.62,vx:(Math.random()-.5)*.0015,vy:(Math.random()-.5)*.0015,t:Math.random()*6})),
    pulsePhase:0,
    metrics:{load:.63,tokens:4680,queue:184,verify:.91,latency:42,mem:61,io:74,workers:12,alerts:2,ctx:183,shards:7}
  };

  const panelMeta = {
    header:{title:'DNA UPLINK',text:'High-level command strip: mode, runtime health, queue pressure, and operator controls.',grid:[['Mode','Live / Simulated'],['Canvas','2D retro FUI'],['Intent','Dense monitoring deck'],['Style','Cyberpunk terminal']],list:['Designed to compress top-level state without hiding the rest of the board.','Animated ticker gives a living command-center feel.']},
    workflow:{title:'Workflow Ladder',text:'Primary DNA execution flow showing the general process from intake to ship. Pulses moving across links represent active orchestration traffic.',grid:[['Stages','Intake · Plan · Code · Verify · Memory · Ship'],['Active stage','Verify'],['Shards','7'],['Packets','Live']],list:['Nodes brighten when traffic peaks.','A low-brightness rail keeps the path visible even while idle.']},
    pulse:{title:'Pulse Bus',text:'Central live signal surface. It mixes a heartbeat-like bus line, dual telemetry waves, and DNA system health framing.',grid:[['Heartbeat','Synthetic / alive'],['Waves','Dual band'],['Status','Stable'],['Burst boost','Enabled']],list:['Center hero panel for overall “life” of the system.','Bright pulse spikes respond to burst mode.']},
    terminal:{title:'Terminal Feed',text:'Textual event stream for operators who want raw status lines instead of charts. Right-to-left motion on some tapes keeps the scene feeling active.',grid:[['Feed rate','Continuous'],['Log class','Mixed'],['Operator view','Condensed'],['Noise','Intentional retro texture']],list:['A terminal makes the UI feel grounded and practical.','Useful for surfacing quick action summaries.']},
    topology:{title:'Agent Topology',text:'Loose topology sketch showing planner, coder, verifier, memory, watcher, and task shards. Node motion is intentionally subtle, more like live circuitry than a physics demo.',grid:[['Nodes','18'],['Traffic','Adaptive'],['Shape','Loose mesh'],['Purpose','Relation view']],list:['Connection flashes indicate message flow.','Soft drift keeps the graph alive without becoming chaotic.']},
    tokens:{title:'Token Reservoir',text:'A pressure-style display for token usage and reserves. Bars and cells move independently to avoid dead stillness.',grid:[['Reserve',()=>Math.round(state.metrics.tokens)],['Drain','Burst-sensitive'],['Warning level','Soft amber'],['Role','Resource pressure']],list:['Should make token usage feel like a physical resource.','High bursts visibly increase movement elsewhere in the board.']},
    verify:{title:'Verifier Array',text:'Mini bars for test health, validation, acceptance status, and confidence. Bright bars imply machine-checkable success.',grid:[['Acceptance',()=>Math.round(state.metrics.verify*100)+'%'],['Checks','14/15'],['Signal','Strong'],['Bias','Deterministic']],list:['Inspired by lab hardware more than modern SaaS widgets.','Good spot for real future verifier metrics.']},
    queue:{title:'Queue / Latency',text:'Dual-history pane comparing queue count and latency over time.',grid:[['Queue',()=>Math.round(state.metrics.queue)],['Latency',()=>Math.round(state.metrics.latency)+' ms'],['Window','64 ticks'],['Smoothing','Soft']],list:['One line keeps backlog visible.','Second line helps separate speed from load.']},
    memory:{title:'CTX / MEM / IO',text:'Compact table-like pane for context, memory, I/O, and retention figures. Dense by design.',grid:[['CTX',()=>Math.round(state.metrics.ctx)+'k'],['MEM',()=>Math.round(state.metrics.mem)+'%'],['I/O',()=>Math.round(state.metrics.io)+'%'],['Retention','88%']],list:['Small tables are classic command-center UX.','Pairs well with broader visual panels.']},
    heat:{title:'Permit Heat',text:'Heat tiles for memory pressure, permit usage, and minor runtime hotspots.',grid:[['Grid','8 × 16'],['Heat','Moderate'],['Decay','Slow'],['Focus','Pressure mapping']],list:['A heat panel adds density without needing labels everywhere.','Helps break up the board with a different visual grammar.']},
    radar:{title:'Worker Radar',text:'Circular sweep to show workers, watchers, and anomalies entering orbit.',grid:[['Workers',()=>Math.round(state.metrics.workers)],['Anomalies',()=>Math.round(state.metrics.alerts)],['Sweep','Continuous'],['Interpretation','Approximate']],list:['Retro radar remains one of the most readable sci-fi motifs.','Blips pulse to hint at worker activity.']},
    spectrum:{title:'Telemetry Spectrum',text:'Animated vertical analyzers for signal energy, route noise, and monitor activity.',grid:[['Bands','28'],['Motion','Independent'],['Peak hold','Soft'],['Visual role','Ambient telemetry']],list:['Great filler panel because it gives constant life to the board.','Lets color accents breathe.']},
    miniFlow:{title:'Shard Checklist',text:'Micro progress panel for the internal checklist of the current workflow stage.',grid:[['Current stage','Verify'],['Checklist items','5'],['Completed','4'],['Escalation','None']],list:['Small process panels make the screen feel more purposeful.','Good candidate for future per-stage modal drilldowns.']},
    alerts:{title:'Alert Tape',text:'Short-form alert tape for state changes, warnings, and transitions.',grid:[['Level','Low'],['Current count',()=>Math.round(state.metrics.alerts)],['Tape mode','Looping'],['Priority','Mixed']],list:['Tiny, dense message panes are very DNA-friendly.','Useful for adding urgency without covering the whole scene.']},
    ticker:{title:'Action Ribbon',text:'Bottom action ribbon pushing right-to-left updates across the whole screen.',grid:[['Direction','Right → Left'],['Purpose','Ambient action feed'],['Compression','High'],['Feel','Terminal / market tape hybrid']],list:['A moving ribbon instantly makes a static board feel operational.','Can later be wired to real event JSON.']}
  };

  function theme(){ return themes[state.theme]; }
  function rgba(hex,a){ const h=hex.replace('#',''); const n=parseInt(h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function text(txt,x,y,size=11,color=theme().soft,align='left',font='ui-monospace,Consolas,monospace',weight='400'){
    ctx.fillStyle=color; ctx.font=`${weight} ${size}px ${font}`; ctx.textAlign=align; ctx.fillText(txt,x,y);
  }
  function panelFrame(p, accent, glow=1){
    ctx.save();
    rr(p.x,p.y,p.w,p.h,18); ctx.clip();
    const g=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    g.addColorStop(0,rgba('#ffffff',.045)); g.addColorStop(.14,theme().panel); g.addColorStop(1,'rgba(4,8,12,.92)');
    ctx.fillStyle=g; ctx.fillRect(p.x,p.y,p.w,p.h);
    // micro grid
    ctx.strokeStyle=rgba(accent,.05); ctx.lineWidth=1;
    for(let i=0;i<p.w;i+=22){ ctx.beginPath(); ctx.moveTo(p.x+i,p.y); ctx.lineTo(p.x+i,p.y+p.h); ctx.stroke(); }
    for(let j=0;j<p.h;j+=18){ ctx.beginPath(); ctx.moveTo(p.x,p.y+j); ctx.lineTo(p.x+p.w,p.y+j); ctx.stroke(); }
    // focused sweep
    const sx = p.x + ((performance.now()*0.03 + p.x*0.8)%(p.w+120))-60;
    const sweep = ctx.createLinearGradient(sx,p.y,sx+60,p.y);
    sweep.addColorStop(0,'rgba(255,255,255,0)'); sweep.addColorStop(.46,rgba('#ffffff',.02*glow)); sweep.addColorStop(.54,rgba(accent,.10*glow)); sweep.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sweep; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.restore();
    // outer glow and border
    const shadow = ctx.createRadialGradient(p.x+p.w*.5,p.y+p.h*.5,10,p.x+p.w*.5,p.y+p.h*.5,Math.max(p.w,p.h));
    shadow.addColorStop(0,rgba(accent,.08*glow)); shadow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=shadow; ctx.beginPath(); ctx.ellipse(p.x+p.w*.5,p.y+p.h*.5,p.w*.52,p.h*.58,0,0,Math.PI*2); ctx.fill();
    rr(p.x,p.y,p.w,p.h,18); ctx.strokeStyle=rgba(accent,.35); ctx.lineWidth=1.1; ctx.stroke();
    // corner brackets
    ctx.strokeStyle=rgba(theme().edge,.72); ctx.lineWidth=1.3;
    const c=14;
    [[p.x+8,p.y+8,1,1],[p.x+p.w-8,p.y+8,-1,1],[p.x+8,p.y+p.h-8,1,-1],[p.x+p.w-8,p.y+p.h-8,-1,-1]].forEach(([x,y,sx2,sy2])=>{
      ctx.beginPath(); ctx.moveTo(x,y+sy2*c); ctx.lineTo(x,y); ctx.lineTo(x+sx2*c,y); ctx.stroke();
    });
  }
  function panelLabel(p,title,sub,accent){
    text(title,p.x+14,p.y+18,12,theme().edge,'left','Inter,system-ui,sans-serif','700');
    text(sub,p.x+p.w-14,p.y+18,10,rgba(accent,.86),'right');
  }
  function clipPanel(p){ rr(p.x,p.y,p.w,p.h,18); ctx.clip(); }

  function pushTerm(line){
    state.termLines.unshift(line);
    if(state.termLines.length>18) state.termLines.pop();
  }
  function seedTerminal(){
    ['> boot dna.monitor','> planner.route = stable','> verifier acceptance 91%','> queue ingest 184','> memory vault retention 88%','> alert tape nominal'].forEach(pushTerm);
  }

  function spawnParticle(mult=1){
    const sources=['workflow','pulse','topology','tokens','memory'];
    const src=sources[Math.floor(Math.random()*sources.length)];
    const a=layoutsById[src];
    if(!a) return;
    state.particles.push({
      x:a.x+a.w*(.12+Math.random()*.76), y:a.y+a.h*(.2+Math.random()*.6),
      vx:rnd(-.25,.25)*mult, vy:rnd(-.08,.08)*mult, life:rnd(24,52), max:rnd(24,52), c:Math.random()>.66?'line3':Math.random()>.5?'line2':'line'
    });
  }

  let layoutsById = {};
  function layout(){
    const W=state.W,H=state.H; const m=14,g=10, top=68, bottom=36;
    const availH=H-top-bottom-m; const x1=m, w1=Math.max(220,W*.22); const x2=x1+w1+g, w2=Math.max(320,W*.34); const x3=x2+w2+g, w3=Math.max(170,W*.16); const x4=x3+w3+g, w4=W-x4-m;
    const y1=top;
    const hA=Math.max(120,availH*.23), hB=Math.max(160,availH*.26), hC=Math.max(120,availH*.18), hD=availH-(hA+hB+hC+g*3);
    const leftMiniH=(hD-g)/2;
    const centerBotH=Math.max(120,availH*.19); const centerMiniH=availH-hA-hB-centerBotH-g*3;
    const rightTopH=Math.max(110,availH*.2); const rightMidH=Math.max(120,availH*.18); const rightBotH=availH-rightTopH-rightMidH-g*2;
    const farTopH=Math.max(105,availH*.18); const farMidH=Math.max(110,availH*.18); const farMid2H=Math.max(120,availH*.2); const farBotH=availH-farTopH-farMidH-farMid2H-g*3;
    state.layout=[
      {id:'header',x:m,y:10,w:W-m*2,h:44},
      {id:'terminal',x:x1,y:y1,w:w1,h:hA},
      {id:'topology',x:x1,y:y1+hA+g,w:w1,h:hB},
      {id:'radar',x:x1,y:y1+hA+hB+g*2,w:w1,h:hC},
      {id:'alerts',x:x1,y:y1+hA+hB+hC+g*3,w:w1,h:leftMiniH},
      {id:'spectrum',x:x1,y:y1+hA+hB+hC+leftMiniH+g*4,w:w1,h:leftMiniH},
      {id:'workflow',x:x2,y:y1,w:w2,h:hA},
      {id:'pulse',x:x2,y:y1+hA+g,w:w2,h:hB},
      {id:'heat',x:x2,y:y1+hA+hB+g*2,w:w2,h:centerBotH},
      {id:'miniFlow',x:x2,y:y1+hA+hB+centerBotH+g*3,w:w2,h:centerMiniH},
      {id:'tokens',x:x3,y:y1,w:w3,h:rightTopH},
      {id:'verify',x:x3,y:y1+rightTopH+g,w:w3,h:rightMidH},
      {id:'queue',x:x3,y:y1+rightTopH+rightMidH+g*2,w:w3,h:rightBotH},
      {id:'memory',x:x4,y:y1,w:w4,h:farTopH},
      {id:'ctx',x:x4,y:y1+farTopH+g,w:w4,h:farMidH},
      {id:'workers',x:x4,y:y1+farTopH+farMidH+g*2,w:w4,h:farMid2H},
      {id:'tape',x:x4,y:y1+farTopH+farMidH+farMid2H+g*3,w:w4,h:farBotH},
      {id:'ticker',x:m,y:H-bottom,w:W-m*2,h:26}
    ];
    layoutsById={}; state.layout.forEach(p=>layoutsById[p.id]=p);
  }

  function update(dt,t){
    if(state.paused) return;
    const m=state.metrics;
    state.burst=Math.max(0,state.burst-dt*.8);
    m.load=clamp(m.load+rnd(-.012,.012)+(.62-m.load)*.05, .2,.97);
    m.tokens=clamp(m.tokens+rnd(-35,50)-state.burst*22, 480,12800);
    m.queue=clamp(m.queue+rnd(-3,3)+(186-m.queue)*.04+state.burst*3, 18,420);
    m.verify=clamp(m.verify+rnd(-.008,.008)+(.91-m.verify)*.05, .34,.99);
    m.latency=clamp(m.latency+rnd(-1.2,1.2)+(42-m.latency)*.04+state.burst*2, 8,120);
    m.mem=clamp(m.mem+rnd(-1,1)+(61-m.mem)*.04, 14,96);
    m.io=clamp(m.io+rnd(-1.5,1.5)+(74-m.io)*.04+state.burst*5, 16,99);
    m.ctx=clamp(m.ctx+rnd(-1,1)+(183-m.ctx)*.04, 28,400);
    m.alerts=clamp(Math.round(m.alerts + (Math.random()>.985?1:0) - (Math.random()>.992?1:0)),0,9);
    state.queueHistory.push(m.queue); if(state.queueHistory.length>64) state.queueHistory.shift();
    state.latencyHistory.push(m.latency); if(state.latencyHistory.length>64) state.latencyHistory.shift();
    state.spectrum=state.spectrum.map((v,i)=>clamp(v+rnd(-.13,.13)+((Math.sin(t*.001+i*.4)+1)/2-v)*.12, .06,1));
    state.heat=state.heat.map((row,ri)=>row.map((v,ci)=>clamp(v+rnd(-.06,.06)+((Math.sin(t*.0014+ri*.8+ci*.3)+1)/2-v)*.06,0,1)));
    state.topology.forEach((n,i)=>{n.x=clamp(n.x+n.vx+rnd(-.0009,.0009),.08,.92); n.y=clamp(n.y+n.vy+rnd(-.0009,.0009),.12,.88); if(n.x<=.08||n.x>=.92) n.vx*=-1; if(n.y<=.12||n.y>=.88) n.vy*=-1; n.t+=dt;});
    if(Math.random()>.94) spawnParticle(1+state.burst*1.8);
    state.particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.life-=1;});
    state.particles=state.particles.filter(p=>p.life>0);
    state.pulsePhase += dt*(1.3+state.burst*2.2);
    state.tickerX -= 70*dt; if(state.tickerX < -5000) state.tickerX = 0;
    if(Math.random()>.975){
      const verbs=['dispatch','verify','cache','wake','route','shard','compress','attach','repair','seal','trace'];
      const tags=['planner','verifier','memory','watcher','coder','router'];
      pushTerm(`> ${tags[Math.floor(Math.random()*tags.length)]}.${verbs[Math.floor(Math.random()*verbs.length)]}() :: ${Math.random()>.75?'hold':'ok'}`);
    }
  }

  function drawBackground(t){
    const th=theme();

    modalText.textContent=meta.text;
    modalGrid.innerHTML='';
    meta.grid.forEach(([k,v])=>{ const d=document.createElement('div'); d.className='cell'; d.innerHTML=`<b>${k}</b><span>${typeof v==='function'?v():v}</span>`; modalGrid.appendChild(d); });
    modalList.innerHTML=''; meta.list.forEach(item=>{ const li=document.createElement('li'); li.textContent=item; modalList.appendChild(li); });
    modal.classList.add('show');
  }

  canvas.addEventListener('click',e=>{
    const rect=canvas.getBoundingClientRect(); const x=e.clientX-rect.left, y=e.clientY-rect.top;
    const hit=state.hitRegions.find(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);
    if(hit) openDetail(hit.id);
  });
  document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('show'); });
  document.getElementById('themeBtn').onclick=()=>{ state.theme=(state.theme+1)%themes.length; };
  document.getElementById('burstBtn').onclick=()=>{ state.burst=1.4; for(let i=0;i<16;i++) spawnParticle(1.8); pushTerm('> burst.pulse() :: amplified'); };
  pauseBtn.onclick=()=>{ state.paused=!state.paused; pauseBtn.textContent=state.paused?'RESUME':'PAUSE'; };
  window.addEventListener('keydown',e=>{ if(e.key==='Escape') modal.classList.remove('show'); if(e.key===' '){e.preventDefault(); state.burst=1.4; for(let i=0;i<16;i++) spawnParticle(1.8);} if(e.key.toLowerCase()==='t'){state.theme=(state.theme+1)%themes.length;} });
  function resize(){ state.W=window.innerWidth; state.H=window.innerHeight; canvas.width=Math.round(state.W*DPR); canvas.height=Math.round(state.H*DPR); canvas.style.width=state.W+'px'; canvas.style.height=state.H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
  window.addEventListener('resize',resize);
  resize(); seedTerminal(); for(let i=0;i<22;i++) spawnParticle(); requestAnimationFrame(render);
})();
</script>
</body>
</html>
