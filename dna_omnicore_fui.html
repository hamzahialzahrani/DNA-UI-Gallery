function update(dt,t){if(!sim.running)return;sim.cycles+=Math.floor(dt*58);sim.percent=Math.min(100,sim.percent+dt*.075);if(sim.percent>=100){sim.percent=0;event('Mission cycle checkpoint committed','PASS')}signal+=dt;scan+=dt;if(signal>.11){signal=0;sim.flux.shift();sim.flux.push(Math.max(.12,Math.min(.92,.5+Math.sin(t*1.4)*.14+(Math.random()-.5)*.32)));sim.latency.shift();sim.latency.push(.5+(Math.random()-.5)*.3)}for(let i=0;i<sim.workerProgress.length;i++)sim.workerProgress[i]=(sim.workerProgress[i]+dt*(.03+i%3*.011))%1}
function render(ms){const t=reduced?1:ms/1000,dt=Math.min(.05,Math.max(0,t-(now||t)));now=t;frames=frames*.94+(dt>0?1/dt:60)*.06;active=[];ctx.setTransform(dpr,0,0,dpr,0,0);background(t);update(dt,t);if(W<790||H<620)drawMobile(t);else drawDesktop(t);if(!reduced)requestAnimationFrame(render)}requestAnimationFrame(render);
function log(s){out.textContent+='\n> '+s;out.scrollTop=out.scrollHeight}function openTerminal(){terminal.classList.add('show');input.focus();if(!out.textContent)out.textContent='DNA OMNICORE uplink established.\nAvailable: help, run, pause, job, fault, repair, status, theme 1|2|3, clear.'}function closeTerminal(){terminal.classList.remove('show')}
document.querySelector('#close').addEventListener('click',closeTerminal);input.addEventListener('keydown',e=>{if(e.key!=='Enter')return;let c=input.value.trim().toLowerCase();input.value='';log(c);let [cmd,arg]=c.split(/\s+/);switch(cmd){case'help':log('run · pause · job · fault · repair · status · theme 1|2|3 · clear');break;case'run':sim.running=true;log('Execution resumed');break;case'pause':sim.running=false;log('Execution paused');break;case'job':sim.mission++;sim.percent=0;sim.running=true;log('Mission launched');break;case'fault':sim.errors++;sim.integrity=Math.max(0,sim.integrity-8);log('Fault injected');break;case'repair':sim.errors=Math.max(0,sim.errors-1);sim.integrity=Math.min(100,sim.integrity+8);log('Repair complete');break;case'status':log(`Mission ${sim.mission}; progress ${sim.percent.toFixed(1)}%; integrity ${sim.integrity}%; errors ${sim.errors}; workers ${sim.workers}`);break;case'theme':if(['1','2','3'].includes(arg)){theme=+arg-1;colors=themes[theme];log('Palette changed')}else log('Choose theme 1, 2, or 3');break;case'clear':out.textContent='';break;default:log('Unknown command. Enter help.')}});
function pointer(e){const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;canvas.style.cursor=active.some(b=>mouse.x>=b.x&&mouse.x<b.x+b.w&&mouse.y>=b.y&&mouse.y<b.y+b.h)?'pointer':'crosshair'}canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerleave',()=>{mouse.x=-99;mouse.y=-99});canvas.addEventListener('pointerdown',e=>{pointer(e);const b=[...active].reverse().find(b=>mouse.x>=b.x&&mouse.x<b.x+b.w&&mouse.y>=b.y&&mouse.y<b.y+b.h);if(b)b.fn()});addEventListener('keydown',e=>{if(e.target===input)return;if(e.key.toLowerCase()==='t'){openTerminal()}else if(e.code==='Space'){e.preventDefault();sim.running=!sim.running;event(sim.running?'Execution resumed':'Execution paused')}else if(e.key==='Escape')closeTerminal()});
})();
