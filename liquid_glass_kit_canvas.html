<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass Kit — Sunlit Canvas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#77828b;font-family:Inter,"Segoe UI",Arial,sans-serif}
#app{display:block;width:100vw;height:100vh;cursor:default;touch-action:none}
#entry{position:absolute;width:1px;height:1px;opacity:0;left:-100px;top:-100px}
</style>
</head>
<body>
<canvas id="app" aria-label="Interactive sunlit liquid glass UI with controls, search, tabs and cards"></canvas>
<input id="entry" aria-label="Search or workspace input" spellcheck="false" autocomplete="off" />
<script>
(()=>{
'use strict';
const c=document.getElementById('app'),cx=c.getContext('2d',{alpha:false}),entry=document.getElementById('entry');
const W=619,H=711,TAU=Math.PI*2;
let viewScale=1,originX=0,originY=0,frame=0,last=0,lastPointer=0;
const S={mouse:{x:-100,y:-100,active:false},press:null,hover:null,tab:'Toast',search:'',workspace:'',checked:true,files:true,toggle:false,toast:null,sparks:[],activity:0,lightX:-95,lightY:-112,targetLightX:-95,targetLightY:-112,sunDX:1,sunDY:1,freeze:false,minimized:false,projectCount:3,mode:'search',bubble:0};
const hit=[];let bgCanvas=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}
function rgba(hex,a){let h=hex.replace('#','');let n=parseInt(h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function rpath(x,y,w,h,r){r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function rect(x,y,w,h,color,r=0){cx.fillStyle=color;rpath(x,y,w,h,r);cx.fill()}
function gradient(x,y,w,h,stops,vertical=true){let g=cx.createLinearGradient(x,y,vertical?x:x+w,vertical?y+h:y);for(let [p,v] of stops)g.addColorStop(p,v);return g}
function radial(x,y,r,stops){let g=cx.createRadialGradient(x,y,0,x,y,Math.max(r,1));for(let [p,v] of stops)g.addColorStop(p,v);return g}
function strokeRound(x,y,w,h,r,color,weight=1){cx.strokeStyle=color;cx.lineWidth=weight;rpath(x,y,w,h,r);cx.stroke()}
function text(str,x,y,size=14,color='#1a1e24',weight=400,align='left'){cx.textAlign=align;cx.textBaseline='alphabetic';cx.font=`${weight} ${size}px Inter, "Segoe UI", Arial, sans-serif`;cx.fillStyle=color;cx.fillText(str,x,y)}
function hitbox(name,x,y,w,h,fn,shape='rect'){hit.push({name,x,y,w,h,fn,shape})}
function shadeEllipse(x,y,rx,ry,alpha=.2,blur=20,rotation=-.28){cx.save();cx.translate(x,y);cx.rotate(rotation);cx.filter=`blur(${blur}px)`;cx.fillStyle=`rgba(25,31,47,${alpha})`;cx.beginPath();cx.ellipse(0,0,rx,ry,0,0,TAU);cx.fill();cx.restore()}
function softShadow(x,y,w,h,r,o={}){cx.save();cx.shadowColor=o.color||'rgba(22,26,42,.36)';cx.shadowOffsetX=(o.dx??16)*S.sunDX;cx.shadowOffsetY=(o.dy??22)*S.sunDY;cx.shadowBlur=o.blur??16;rect(x,y,w,h,rgba('#17202a',o.alpha??.055),r);cx.restore()}
function halo(x,y,r,color,opacity=.55,scaleY=1){cx.save();cx.translate(x,y);cx.scale(1,scaleY);cx.fillStyle=radial(0,0,r,[[0,rgba(color,opacity)],[.27,rgba(color,opacity*.32)],[1,rgba(color,0)]]);cx.beginPath();cx.arc(0,0,r,0,TAU);cx.fill();cx.restore()}
function glass(x,y,w,h,r,opts={}){
 const tint=opts.tint||'255,255,255',op=opts.opacity??.21;
 softShadow(x,y,w,h,r,{dx:opts.dx??15,dy:opts.dy??20,blur:opts.blur??14,alpha:.035,color:opts.shadow||'rgba(22,30,44,.4)'});
 cx.save();rpath(x,y,w,h,r);cx.clip();
 if(bgCanvas){cx.globalAlpha=opts.refraction??.35;cx.drawImage(bgCanvas,4,-4,W,H);cx.globalAlpha=1}
 rect(x,y,w,h,`rgba(${tint},${op})`,r);
 cx.fillStyle=gradient(x,y,w,h,[[0,'rgba(255,255,255,.25)'],[.28,'rgba(255,255,255,.045)'],[.65,'rgba(255,255,255,.005)'],[1,'rgba(235,244,255,.15)']]);rpath(x,y,w,h,r);cx.fill();
 if(opts.glow){cx.globalCompositeOperation='screen';halo(x+w*.80,y+h*.82,Math.max(w,h)*.58,opts.glow,.21,.6);cx.globalCompositeOperation='source-over'}
 cx.restore();
 strokeRound(x+.9,y+.9,w-1.8,h-1.8,r,'rgba(255,255,255,.50)',1.35);
 strokeRound(x+3,y+3,w-6,h-6,Math.max(2,r-2),'rgba(245,255,255,.19)',.95);
 cx.save();cx.lineCap='round';cx.strokeStyle=gradient(x,y,Math.max(w,1),1,[[0,'rgba(255,255,255,.75)'],[.37,'rgba(255,255,255,.50)'],[1,'rgba(255,255,255,0)']],false);cx.lineWidth=1.9;cx.beginPath();cx.moveTo(x+r,y+3);cx.lineTo(x+w*.58,y+3);cx.stroke();cx.strokeStyle='rgba(255,255,255,.34)';cx.lineWidth=1;cx.beginPath();cx.moveTo(x+3,y+r);cx.lineTo(x+3,y+h*.72);cx.stroke();cx.restore();
}
function drawBgToBuffer(){
 bgCanvas=document.createElement('canvas');bgCanvas.width=W;bgCanvas.height=H;
 const b=bgCanvas.getContext('2d');
 let g=b.createLinearGradient(0,0,618,707);g.addColorStop(0,'#ead8cb');g.addColorStop(.27,'#cbbec0');g.addColorStop(.58,'#8a939f');g.addColorStop(1,'#647987');b.fillStyle=g;b.fillRect(0,0,W,H);
 const blurred=(fn,px)=>{b.save();b.filter=`blur(${px}px)`;fn();b.restore()};
 blurred(()=>{
  b.fillStyle='#f3e1d2';b.beginPath();b.moveTo(-100,-60);b.lineTo(194,-60);b.lineTo(380,98);b.lineTo(109,445);b.lineTo(-90,490);b.closePath();b.fill();
  b.fillStyle='rgba(77,91,105,.8)';b.beginPath();b.moveTo(232,-60);b.lineTo(740,-60);b.lineTo(740,425);b.lineTo(485,223);b.closePath();b.fill();
  b.fillStyle='rgba(195,160,147,.36)';b.beginPath();b.ellipse(61,506,166,274,-.28,0,TAU);b.fill();
  b.fillStyle='rgba(52,73,93,.46)';b.beginPath();b.ellipse(545,681,149,155,-.3,0,TAU);b.fill();
 },30);
 blurred(()=>{
  let glow=b.createRadialGradient(0,0,8,52,102,350);glow.addColorStop(0,'rgba(255,253,234,.75)');glow.addColorStop(.46,'rgba(255,231,210,.36)');glow.addColorStop(1,'rgba(255,231,206,0)');b.fillStyle=glow;b.fillRect(0,0,W,H);
 },12);
 // fine color flecks to keep glassy image depth, tiny but not grainy
 for(let i=0;i<650;i++){let x=(i*133.47)%W,y=(i*79.63)%H;b.fillStyle=`rgba(255,255,255,${.008+((i*7)%11)*.001})`;b.fillRect(x,y,1,1)}
}
function circleGlass(x,y,r,opts={}){
 shadeEllipse(x+13,y+18,r*.89,r*.41,.28,11,-.5);
 cx.save();cx.shadowColor='rgba(27,38,49,.32)';cx.shadowBlur=13;cx.shadowOffsetX=9;cx.shadowOffsetY=15;
 cx.fillStyle=opts.white?'rgba(252,251,253,.97)':'rgba(241,246,249,.18)';cx.beginPath();cx.arc(x,y,r,0,TAU);cx.fill();cx.restore();
 cx.save();cx.beginPath();cx.arc(x,y,r-.6,0,TAU);cx.clip();
 if(!opts.white&&bgCanvas){cx.globalAlpha=.51;cx.drawImage(bgCanvas,2,-3);cx.globalAlpha=1}
 cx.fillStyle=radial(x-r*.37,y-r*.45,r*1.75,[[0,opts.white?'rgba(255,255,255,.95)':'rgba(255,255,255,.58)'],[.38,opts.white?'rgba(251,252,253,.64)':'rgba(255,255,255,.14)'],[1,opts.white?'rgba(241,243,245,.88)':'rgba(225,228,245,.08)']]);cx.fillRect(x-r,y-r,2*r,2*r);cx.restore();
 cx.lineWidth=1.4;cx.strokeStyle=opts.white?'rgba(255,255,255,.96)':'rgba(255,255,255,.7)';cx.beginPath();cx.arc(x,y,r-1.3,0,TAU);cx.stroke();
 cx.beginPath();cx.arc(x,y,r-4,-Math.PI*.91,-Math.PI*.24);cx.strokeStyle='rgba(255,255,255,.86)';cx.lineWidth=1.75;cx.stroke();
}
function plus(x,y,size=10,color='#1f202a',weight=2.8){cx.save();cx.strokeStyle=color;cx.lineWidth=weight;cx.lineCap='round';cx.beginPath();cx.moveTo(x-size*.55,y);cx.lineTo(x+size*.55,y);cx.moveTo(x,y-size*.55);cx.lineTo(x,y+size*.55);cx.stroke();cx.restore()}
function chevron(x,y,color='#fff',weight=2.7){cx.save();cx.strokeStyle=color;cx.lineWidth=weight;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(x-3.5,y-6);cx.lineTo(x+3,y);cx.lineTo(x-3.5,y+6);cx.stroke();cx.restore()}
function check(x,y,size=9,color='#fff',weight=3){cx.save();cx.strokeStyle=color;cx.lineWidth=weight;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(x-size*.72,y);cx.lineTo(x-size*.18,y+size*.48);cx.lineTo(x+size*.83,y-size*.66);cx.stroke();cx.restore()}
function magnify(x,y,stroke='#7c7f81'){cx.save();cx.strokeStyle=stroke;cx.lineWidth=2.2;cx.beginPath();cx.arc(x-2,y-2,5.4,0,TAU);cx.stroke();cx.beginPath();cx.moveTo(x+2.5,y+2.5);cx.lineTo(x+7,y+7);cx.stroke();cx.restore()}
function pill(x,y,w,h,c1,c2,label,opts={}){
 let pressed=S.press===opts.id;
 if(!pressed){shadeEllipse(x+w*.53+12,y+h+22,w*.44,h*.48,.34,14,-.2);halo(x+w*.74+8,y+h+14,w*.56,c2,.58,.23)}
 softShadow(x,y+(pressed?3:0),w,h,h/2,{dx:11,dy:17,blur:11,color:'rgba(27,29,57,.4)'});
 cx.save();rpath(x,y+(pressed?3:0),w,h,h/2);cx.clip();
 rect(x,y+(pressed?3:0),w,h,gradient(x,y,w,h,[[0,c1],[.23,c1],[.64,c2],[1,c2]]),h/2);
 rect(x,y,w,h,gradient(x,y,w,h,[[0,'rgba(255,255,255,.4)'],[.18,'rgba(255,255,255,.07)'],[.62,'rgba(255,255,255,.01)'],[1,'rgba(14,20,57,.19)']]),h/2);
 cx.fillStyle=radial(x+w*.17,y+h*.05,w*.62,[[0,'rgba(255,255,255,.36)'],[1,'rgba(255,255,255,0)']]);cx.fillRect(x,y,w,h);
 cx.restore();
 strokeRound(x+1,y+1,w-2,h-2,h/2,'rgba(255,255,255,.58)',1.5);
 cx.save();cx.beginPath();cx.moveTo(x+15,y+h-6);cx.bezierCurveTo(x+w*.38,y+h-3,x+w*.68,y+h-3,x+w-18,y+h-7);cx.strokeStyle='rgba(255,255,255,.56)';cx.lineWidth=2.8;cx.shadowColor='rgba(255,255,255,.31)';cx.shadowBlur=5;cx.stroke();cx.restore();
 text(label,x+w/2,y+h*.55+5,14,'#fff',750,'center');
 if(opts.id)hitbox(opts.id,x,y,w,h,opts.fn);
}
function whitePill(x,y,w,h,label,opts={}){
 softShadow(x,y,w,h,h/2,{dx:11,dy:17,blur:13,color:'rgba(30,37,51,.37)'});
 rect(x,y,w,h,gradient(x,y,w,h,[[0,'rgba(255,255,255,.97)'],[.65,'rgba(250,248,253,.92)'],[1,'rgba(231,228,236,.95)']]),h/2);
 strokeRound(x+.7,y+.7,w-1.4,h-1.4,h/2,'rgba(255,255,255,.75)',1.5);
 text(label,x+18,y+h/2+5,opts.size||12.5,'#85817e',460);
 if(opts.search)magnify(x+w-24,y+h/2,'#858585');
 if(opts.id)hitbox(opts.id,x,y,w,h,opts.fn);
}
function translucentButton(x,y,w,h,label,opts={}){

}
function shinyChip(x,y,w,h,label,opts={}){
 glass(x,y,w,h,16,{opacity:.18,blur:13,dx:11,dy:15});
 if(opts.checkbox){cx.strokeStyle=opts.checked?'#786ef4':'#8e82e9';cx.lineWidth=1.5;cx.strokeRect(x+14,y+14,17,17);if(opts.checked)check(x+22.5,y+22,8,'#766bf1',2.4)}

 if(opts.id)hitbox(opts.id,x,y,w,h,opts.fn);
}
function projectIcon(x,y){
 glass(x,y,37,37,12,{opacity:.84,blur:8,dx:5,dy:8});
 cx.save();cx.translate(x+18,y+18);cx.rotate(-.15);
 let gradient1=cx.createLinearGradient(-12,-10,10,11);gradient1.addColorStop(0,'#946aff');gradient1.addColorStop(.55,'#5aa6eb');gradient1.addColorStop(1,'#43d4be');
 cx.fillStyle=gradient1;cx.beginPath();cx.moveTo(-9,9);cx.bezierCurveTo(-7,-4,-2,-5,9,-10);cx.bezierCurveTo(11,3,-3,1,-5,9);cx.closePath();cx.fill();
 cx.fillStyle='#7b52da';cx.beginPath();cx.arc(4,3,4.5,0,TAU);cx.fill();cx.restore();
}

 glass(x,y,101,48,24,{opacity:.08,dx:13,dy:16,blur:13});

 if(on){halo(x+45,y+24,43,'#77e6de',.26,.6)}

 cx.fillStyle=gradient(506,326,24,36,[[0,'rgba(177,158,255,.65)'],[1,'rgba(139,235,226,.38)']]);cx.beginPath();cx.arc(518,344,13.5,0,TAU);cx.fill();

function searchPanel(time){

 cx.save();rpath(286,172,252,124,23);cx.clip();

function segmented(){

function renderMain(time){
 const mx=S.mouse.x,my=S.mouse.y;
 cx.drawImage(bgCanvas,0,0);

function render(timestamp){
 let dt=Math.min(.05,(timestamp-last)/1000||.016);last=timestamp;frame++;
 if(!S.freeze){S.activity+=dt;for(let sp of S.sparks){sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=20*dt;sp.life-=dt}}
 cx.save();cx.setTransform(1,0,0,1,0,0);
 let surround=cx.createLinearGradient(0,0,c.width,0);surround.addColorStop(0,'#eee0d0');surround.addColorStop(.22,'#f1e1d2');surround.addColorStop(.51,'#abb0b8');surround.addColorStop(.78,'#657684');surround.addColorStop(1,'#657684');cx.fillStyle=surround;cx.fillRect(0,0,c.width,c.height);
 let edgeSun=cx.createRadialGradient(0,0,0,0,0,c.width*.9);edgeSun.addColorStop(0,'rgba(255,246,222,.28)');edgeSun.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=edgeSun;cx.fillRect(0,0,c.width,c.height);cx.restore();
 cx.save();cx.translate(originX,originY);cx.scale(viewScale,viewScale);
 hit.length=0;renderMain(S.activity*1000);
 cx.restore();requestAnimationFrame(render)
}
function pick(x,y){for(let i=hit.length-1;i>=0;i--){let h=hit[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)return h}return null}
function coords(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left-originX)/viewScale,y:(e.clientY-r.top-originY)/viewScale}}
function focusEntry(mode){S.mode=mode;entry.value=S[mode];entry.focus();toast(mode==='search'?'Type your search…':'Name your workspace…')}
entry.addEventListener('input',()=>{S[S.mode]=entry.value.slice(0,24)});
entry.addEventListener('keydown',e=>{if(e.key==='Enter'){entry.blur();toast(S.mode==='search'?'Searching for '+(S.search||'projects'):'Workspace created: '+(S.workspace||'Untitled'))}if(e.key==='Escape')entry.blur()});
c.addEventListener('pointermove',e=>{let p=coords(e);S.mouse.x=p.x;S.mouse.y=p.y;S.mouse.active=true;
 if(e.shiftKey){S.sunDX=clamp(1+(p.x-310)/390,.3,1.8);S.sunDY=clamp(1+(p.y-355)/450,.3,1.8)}
 let h=pick(p.x,p.y);S.hover=h?.name||null;c.style.cursor=h?'pointer':'default'});
c.addEventListener('pointerleave',()=>{S.mouse.active=false;S.hover=null});
c.addEventListener('pointerdown',e=>{let p=coords(e);let h=pick(p.x,p.y);S.press=h?.name||null;if(h){c.setPointerCapture?.(e.pointerId)} });
c.addEventListener('pointerup',e=>{let p=coords(e),h=pick(p.x,p.y);if(h&&h.name===S.press)h.fn();S.press=null});
function resize(){let dpr=Math.min(2,window.devicePixelRatio||1);c.width=Math.round(window.innerWidth*dpr);c.height=Math.round(window.innerHeight*dpr);let fit=Math.min(window.innerWidth/W,window.innerHeight/H);viewScale=fit*dpr;originX=(c.width-W*viewScale)/2;originY=(c.height-H*viewScale)/2;drawBgToBuffer()}
window.addEventListener('resize',resize);
resize();requestAnimationFrame(render);
})();
