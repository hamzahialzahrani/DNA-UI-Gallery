function wrapText(s,x,y,w,lh,col){g.font='12px Consolas,monospace';let cur='',ln=0;for(const word of s.split(' ')){const candidate=cur?cur+' '+word:word;if(g.measureText(candidate).width>w){txt(cur,x,y+ln*lh,12,col);cur=word;ln++}else cur=candidate}if(cur)txt(cur,x,y+ln*lh,12,col)}
function handleCommand(raw){const cmd=raw.trim();state.termInput='';if(!cmd)return;addEvent('CMD',`dna:/> ${cmd}`);const [a,b]=cmd.split(/\s+/);switch(a.toLowerCase()){

 case 'status':addEvent('INFO',`queue=${state.queue} tok=${state.tokens} check=${state.checks}/${state.checkTotal}`);break;

 }}

function resize(){const dpr=Math.min(devicePixelRatio||1,2);const w=innerWidth,h=innerHeight;c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);scale=Math.min(w/VW,h/VH)*dpr;ox=(c.width-VW*scale)/2;oy=(c.height-VH*scale)/2}
function coords(e){const r=c.getBoundingClientRect(),dpr=c.width/r.width;return{x:((e.clientX-r.left)*dpr-ox)/scale,y:((e.clientY-r.top)*dpr-oy)/scale}}

});
