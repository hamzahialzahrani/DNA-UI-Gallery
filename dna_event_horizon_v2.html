const g=(m,w,a)=>a*Math.exp(-Math.pow((lag-m)/w,2));

}

const lag=head-x,fade=Math.pow(clamp(1-lag/183,0,1),1.55),exit=clamp((duration+470-age)/470,0,1);

function modalNode(tag,textVal,cls=''){
const e=document.createElement(tag);if(cls)e.className=cls;if(textVal!==undefined)e.textContent=String(textVal);return e;
}
function addModalStat(label,value){const cell=modalNode('div',undefined,'modal-stat');cell.append(modalNode('small',label.toUpperCase()),modalNode('strong',value));return cell}
function listRow(label,value){const li=modalNode('li');li.append(modalNode('span',label),modalNode('span',value));return li}
function showModal(title){lastModalFocus=document.activeElement;S.modalOpen=true;modalBody.replaceChildren();modalTitle.textContent=title;modalMessage.textContent='';modal.classList.add('open');modal.setAttribute('aria-hidden','false');modalClose.focus()}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');S.modalOpen=false;modalBody.replaceChildren();if(lastModalFocus&&typeof lastModalFocus.focus==='function')lastModalFocus.focus();else canvas.focus()}
modalClose.addEventListener('click',closeModal);modal.addEventListener('pointerdown',e=>{if(e.target===modal)closeModal()});
function openDetails(name){
if(S.modalOpen)return;
const raw=String(name),kind=raw.toUpperCase();showModal('DNA // '+kind.slice(0,37));
const h=modalNode('h3','LIVE STRUCTURED STATE / CLICK INSERT TO SIMULATE A NEW EVENT');
modalBody.append(h);
const matrix=modalNode('div',undefined,'modal-matrix'),rows=modalNode('ul',undefined,'modal-list');let note='These values come from the current JSON replay state. The FUI is a renderer; it does not invent runtime measurements.';
let stats=[];
if(raw.startsWith('agent:')){let n=raw.slice(6),a=S.agents[n];if(!a)return;stats=[['AGENT',n.toUpperCase()],['STATUS',a.state],['TOKENS LEFT',fmt(a.left)],['RESERVE',Math.round(a.left/a.budget*100)+'%']];rows.append(listRow('Agent → core RPC count',a.requests),listRow('Core → agent dispatch count',a.dispatches),listRow('Tokens spent',fmt(a.tokens)),listRow('Last event',a.last>=0?(a.last/1000).toFixed(2)+'s':'N/A'));note='RPC events emit incoming particles. Dispatch events emit outward particles. Token debits reduce the visible reserve. These are separate measures: visual particles are not literal tokens.'}
else if(raw.startsWith('worker:')){let id=Number(raw.slice(7)),w=S.workers[id-1];if(!w)return;stats=[['SHARD',pad(w.id)],['STATE',w.state.toUpperCase()],['PROGRESS',w.percent+'%'],['SCHEDULER','EVENT-DRIVEN']];rows.append(listRow('Worker wake events',S.checks),listRow('Queued items',S.queue));note='Workers remain asleep until an explicit event marks them as awake. No LLM status polling is implied.'}
else if(kind.includes('HEARTBEAT')){stats=[['CORE',S.coreAlive?'ALIVE':'DEAD'],['LAST HEARTBEAT',S.lastBeat<0?'WAITING':(S.lastBeat/1000).toFixed(2)+'s'],['TTL REMAINING',S.coreAlive?Math.max(0,(7500-(S.now-S.lastBeat))/1000).toFixed(2)+'s':'0s'],['OBSERVED EVENTS',S.beats.length+' recent']];rows.append(listRow('Healthy visual', 'Green fast ECG, fading tail'),listRow('Dead visual','Weak red sweep; not a received heartbeat'),listRow('Timeout threshold','7.5 seconds'));note='A red micro-pulse is an alert visualization, not proof that the runtime is still alive. The actual liveness status comes from runtime heartbeat events and timeout logic.'}
else if(kind.includes('TOPOLOGY')||kind.includes('ORCHESTRATOR')){stats=[['CORE',S.coreAlive?'LIVE':'UNRESPONSIVE'],['RPC COUNT',S.calls],['DISPATCHES',S.dispatches],['ACTIVE PACKETS',S.flows.length]];for(const n of fixedAgents)rows.append(listRow(n.toUpperCase(),`${S.agents[n].state} · ${fmt(S.agents[n].left)} tokens remain`));note='Particle direction and quantity are determined by event type and volume, not decorative randomness.'}
else if(kind.includes('TOKEN')){stats=[['TOKENS SPENT',fmt(S.tokens)],['LIVE AGENTS',fixedAgents.length],['AVAILABLE',fmt(fixedAgents.reduce((n,a)=>n+S.agents[a].left,0))],['BUDGET','PER AGENT']];for(const n of fixedAgents)rows.append(listRow(n.toUpperCase(),`${fmt(S.agents[n].tokens)} used / ${fmt(S.agents[n].budget)} budget`));}
else if(kind.includes('TELEMETRY')){stats=[['RPC TOTAL',S.calls],['TOKEN TOTAL',fmt(S.tokens)],['QUEUE',S.queue],['SAMPLES',S.history.length]];rows.append(listRow('Chart grain','1 second'),listRow('Input','JSON events'),listRow('Sliding history','up to 92 samples'));}
else if(kind.includes('WORKER')){let counts={};for(let w of S.workers)counts[w.state]=(counts[w.state]||0)+1;stats=[['SHARDS',S.workers.length],['RUNNING',counts.run||0],['SLEEPING',counts.sleep||0],['COMPLETED',counts.done||0]];Object.entries(counts).forEach(([k,v])=>rows.append(listRow(k.toUpperCase(),v)));note='Scheduler visualization is updated only by worker.state JSON events.'}
else if(kind.includes('CONTRACT')||kind.includes('PLAN')){stats=[['STAGE',S.stage],['TESTS',S.tests.passed+'/'+S.tests.total],['RUNTIME VERSION',S.tape.meta.runtimeVersion],['QUEUE',S.queue]];rows.append(listRow('Job ID',S.tape.meta.runId),listRow('Current step',S.phase),listRow('Checkpoint events',S.checkpoints.length));note='Acceptance tests are machine-checkable contracts, and Ghost runtime—not the agent’s claim—determines pass/fail.'}
else if(kind.includes('EVENT TERMINAL')){stats=[['LOG ENTRIES',S.logs.length],['EVENTS',S.events],['REPLAY CLOCK',(S.now/1000).toFixed(1)+'s'],['SPEED',S.speed+'×']];for(const e of S.logs.slice(-8).reverse())rows.append(listRow(e.type,e.msg.slice(0,62)));}
else {stats=[['EVENTS',S.events],['CALLS',S.calls],['DISPATCHES',S.dispatches],['CORE',S.coreAlive?'LIVE':'DEAD']];rows.append(listRow('Run',S.tape.meta.runId),listRow('Current stage',S.stage),listRow('Agent channels',fixedAgents.length));}
for(const [a,b] of stats)matrix.append(addModalStat(a,b));
modalBody.append(matrix,rows,modalNode('p',note,'modal-note'));
const actions=modalNode('div',undefined,'modal-actions');const b=modalNode('button','⊕ INSERT JSON EVENT');b.type='button';b.addEventListener('click',openEventModal);const r=modalNode('button','REFRESH DETAILS');r.type='button';r.addEventListener('click',()=>{S.modalOpen=false;openDetails(raw)});actions.append(b,r);modalBody.append(actions);
}
function field(label,tag='input',opts=[],value=''){
const wrap=modalNode('label',undefined,'modal-field');wrap.append(modalNode('span',label.toUpperCase()));const control=modalNode(tag);if(tag==='select'){for(const o of opts){let item=modalNode('option',o[1]);item.value=o[0];control.append(item)}control.value=value||opts[0][0]}else{control.type='number';control.min='0';control.max='50000';control.step='1';control.value=value}wrap.append(control);return {wrap,control};
}
function openEventModal(){
if(S.modalOpen)closeModal();showModal('DNA // INSERT JSON EVENT');

const form=modalNode('form');form.id='insertEventForm';const a=field('Event type','select',[
['agent.call','Agent → core call'],['core.dispatch','Core → agent dispatch'],['usage.tokens','Token consumption'],['runtime.heartbeat','Runtime heartbeat'],['runtime.dead','Core failure'],['runtime.recovered','Core recovery'],['checkpoint.saved','Checkpoint persisted'],['test.result','Test results'],['worker.state','Worker state']]);

const passed=field('Passed tests','input',[],'5');const total=field('Total tests','input',[],'6');

const extra=modalNode('div',undefined,'modal-row');extra.append(amount.wrap,worker.wrap);
const more=modalNode('div',undefined,'modal-row');more.append(wState.wrap,passed.wrap);
const last=modalNode('div',undefined,'modal-row');last.append(total.wrap);
form.append(cells,extra,more,last);
function visibility(){const typ=a.control.value;agent.wrap.style.display=['agent.call','core.dispatch','usage.tokens'].includes(typ)?'':'none';amount.wrap.style.display=['agent.call','core.dispatch','usage.tokens'].includes(typ)?'':'none';worker.wrap.style.display=typ==='worker.state'?'':'none';wState.wrap.style.display=typ==='worker.state'?'':'none';passed.wrap.style.display=total.wrap.style.display=typ==='test.result'?'':'none';}
a.control.addEventListener('change',visibility);visibility();
const actions=modalNode('div',undefined,'modal-actions');const save=modalNode('button','⊕ EMIT EVENT');save.type='submit';const cancel=modalNode('button','CANCEL');cancel.type='button';cancel.addEventListener('click',closeModal);actions.append(save,cancel);form.append(actions);form.addEventListener('submit',e=>{e.preventDefault();const typ=a.control.value;const num=Number(amount.control.value),wk=Number(worker.control.value),pass=Number(passed.control.value),tot=Number(total.control.value);if([num,wk,pass,tot].some(v=>!Number.isFinite(v))){modalMessage.textContent='Enter finite numeric values.';return}const evt={at:Math.round(Math.min(S.duration-1,S.now+100)),type:typ};if(['agent.call','core.dispatch','usage.tokens'].includes(typ))evt.agent=agent.control.value;if(typ==='usage.tokens')evt.tokens=clamp(Math.floor(num),0,50000);if(typ==='agent.call'||typ==='core.dispatch')evt.count=clamp(Math.floor(num),1,40);if(typ==='worker.state'){evt.worker=clamp(Math.floor(wk),1,24);evt.state=wState.control.value;evt.progress=evt.state==='done'?100:evt.state==='run'?50:0}if(typ==='test.result'){evt.total=clamp(Math.floor(tot),0,1000);evt.passed=clamp(Math.floor(pass),0,evt.total)}
// Do not mutate already-replayed history; insert among future events only.
let k=S.next;while(k<S.tape.events.length&&S.tape.events[k].at<=evt.at)k++;S.tape.events.splice(k,0,evt);S.ended=false;if(!S.playing)S.playing=true;
log('CMD',`INSERTED ${typ.toUpperCase()} @ ${(evt.at/1000).toFixed(2)}S`);closeModal();});modalBody.append(form);a.control.focus();
}

function pointerPosition(e){let r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
canvas.addEventListener('pointermove',e=>{const pos=pointerPosition(e);S.mouse=pos;if(S.fx&&!reduced&&S.mouseFX.length<150){for(let j=0;j<2;j++)S.mouseFX.push({x:pos[0],y:pos[1],age:0,life:320+rand()*380,r:.8+rand()*1.7,vx:(rand()-.5)*2.6,vy:(rand()-.5)*2.6,c:rand()<.7?C.cyan:C.violet})}let hit=[...S.regions].reverse().find(r=>inside(...S.mouse,r));canvas.style.cursor=hit?'pointer':'crosshair';canvas.title=hit?hit.label:''});canvas.addEventListener('pointerleave',()=>{S.mouse=[-1,-1]});canvas.addEventListener('pointerdown',e=>{S.mouse=pointerPosition(e);if(S.fx&&!reduced)for(let i=0;i<22;i++){let a=i/22*6.283;S.mouseFX.push({x:S.mouse[0],y:S.mouse[1],age:0,life:360+rand()*220,r:1+rand()*2,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4,c:C.violet})}for(let i=S.regions.length-1;i>=0;i--){let r=S.regions[i];if(inside(...S.mouse,r)){r.cb();canvas.focus();return}}canvas.focus()});
window.addEventListener('keydown',e=>{if(S.modalOpen){if(e.key==='Escape'){e.preventDefault();closeModal()}return}if(e.target===input||e.target===fileInput||e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='Escape'&&S.modalOpen){closeModal();return}if(e.key==='Insert'||e.key.toLowerCase()==='i'&&e.shiftKey){e.preventDefault();openEventModal();return}if(['Space','ArrowRight'].includes(e.code)||e.key.toLowerCase()==='t'){e.preventDefault();if(e.code==='Space')toggle();else if(e.code==='ArrowRight')nextEvent();else openTerminal()}});
function loop(ts){let dt=S.last?Math.min(65,ts-S.last):16;S.last=ts;if(S.playing&&!S.ended)tick((reduced?Math.min(dt,50):dt)*S.speed);const animate=!reduced&&S.playing;for(let i=S.mouseFX.length-1;i>=0;i--){S.mouseFX[i].age+=Math.min(dt,65)}S.visualClock+=dt;for(let i=S.flows.length-1;i>=0;i--){const f=S.flows[i];if(animate)f.t+=dt*S.speed;if(f.t>f.life+f.delay)S.flows.splice(i,1)}draw(reduced?0:S.now);requestAnimationFrame(loop)}
reset();setSize();requestAnimationFrame(loop);
