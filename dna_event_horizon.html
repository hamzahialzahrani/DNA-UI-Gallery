canvas.addEventListener('pointermove',e=>{S.mouse=pointerPosition(e);let hit=S.regions.find(r=>inside(...S.mouse,r));canvas.style.cursor=hit?'pointer':'crosshair';canvas.title=hit?hit.label:''});canvas.addEventListener('pointerleave',()=>{S.mouse=[-1,-1]});canvas.addEventListener('pointerdown',e=>{S.mouse=pointerPosition(e);for(let i=S.regions.length-1;i>=0;i--){let r=S.regions[i];if(inside(...S.mouse,r)){r.cb();canvas.focus();return}}canvas.focus()});
window.addEventListener('keydown',e=>{if(e.target===input||e.target===fileInput||e.ctrlKey||e.altKey||e.metaKey)return;if(['Space','ArrowRight'].includes(e.code)||e.key.toLowerCase()==='t'){e.preventDefault();if(e.code==='Space')toggle();else if(e.code==='ArrowRight')nextEvent();else openTerminal()}});
function loop(ts){let dt=S.last?Math.min(65,ts-S.last):16;S.last=ts;if(S.playing&&!S.ended)tick((reduced?Math.min(dt,50):dt)*S.speed);const animate=!reduced&&S.playing;for(let i=S.flows.length-1;i>=0;i--){const f=S.flows[i];if(animate)f.t+=dt*S.speed;if(f.t>f.life+f.delay)S.flows.splice(i,1)}draw(reduced?0:S.now);requestAnimationFrame(loop)}
reset();setSize();requestAnimationFrame(loop);
})();
