function clicked(e){let rect=canvas.getBoundingClientRect();S.mouse.x=(e.clientX-rect.left)*W/rect.width;S.mouse.y=(e.clientY-rect.top)*H/rect.height;for(let a of [...S.regions].reverse())if(S.mouse.x>=a.x&&S.mouse.x<=a.x+a.w&&S.mouse.y>=a.y&&S.mouse.y<=a.y+a.h){a.cb();return}}canvas.addEventListener('pointerdown',clicked);canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();S.mouse.x=(e.clientX-r.left)*W/r.width;S.mouse.y=(e.clientY-r.top)*H/r.height;let hit=S.regions.some(a=>S.mouse.x>=a.x&&S.mouse.x<=a.x+a.w&&S.mouse.y>=a.y&&S.mouse.y<=a.y+a.h);canvas.style.cursor=hit?'pointer':'crosshair'});canvas.addEventListener('pointerleave',()=>{S.mouse.x=-1;S.mouse.y=-1});
window.addEventListener('keydown',e=>{if(document.activeElement===input)return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='t'||e.key==='T')showTerminal();else if(e.key==='n'||e.key==='N')newJob()});
function render(ts){let dt=Math.min(.06,Math.max(0,(ts-S.last)/1000));S.last=ts;if(S.run&&!S.reduced){S.clock+=dt;S.cpu=Math.max(28,Math.min(88,S.cpu+(Math.random()-.5)*1.5));S.gpu=Math.max(39,Math.min(97,S.gpu+(Math.random()-.5)*1.8));S.mem=Math.max(48,Math.min(82,S.mem+(Math.random()-.5)*.7));S.net=Math.max(20,Math.min(85,S.net+(Math.random()-.5)*2.8));if(S.frame%7===0){S.chart.shift();S.chart.push(Math.max(16,Math.min(92,50+Math.sin(S.clock*1.3)*17+(Math.random()-.5)*17)))}}let time=S.reduced?0:S.clock*1000;S.regions=[];drawBack(time);topbar();sideLeft(time);center(time);right(time);chartSection(time);controls();footer();if(S.run&&!S.reduced&&S.frame%108===0)addLog(['SYS','TEST','NET'][Math.floor(Math.random()*3)],['WORKER 07 / ACCEPTED CHECKPOINT','DETERMINISTIC SUITE / PASS','PACKET ACK / NEURAL BUS'][Math.floor(Math.random()*3)]);S.frame++;requestAnimationFrame(render)}
