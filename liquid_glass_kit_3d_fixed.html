<div id="stage"><canvas id="gpu"></canvas><canvas id="flat"></canvas><canvas id="ink"></canvas></div>

<script id="vert" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 uv;
void main(){ vec2 p=vec2(gl_VertexID==1?3.:-1.,gl_VertexID==2?3.:-1.);uv=.5*(p+1.);gl_Position=vec4(p,0.,1.); }
</script>
<script id="frag" type="x-shader/x-fragment">#version 300 es
precision highp float;
#define N 20
in vec2 uv;out vec4 outColor;
uniform vec2 res;
uniform float time;
uniform vec2 sun;
uniform vec4 objs[N];
uniform vec4 props[N];
uniform float enabled;
uniform vec2 touched;
uniform float clickPulse;
vec2 P;
float sdRound(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float sdItem(vec2 p,int i){return sdRound(p-objs[i].xy,objs[i].zw*.5,props[i].x);}
float gaussian(float x,float s){return exp(-x*x/(s*s));}
vec3 backdrop(vec2 p){
 float s=smoothstep(-160.,680.,p.x*.56+p.y*.88);
 vec3 warm=vec3(.967,.892,.828),cool=vec3(.34,.414,.479);
 vec3 col=mix(warm,cool,s*.84);
 float diagonal=1.-smoothstep(-175.,220.,p.y-p.x*.74-70.);
 col+=vec3(.22,.18,.14)*diagonal*.42;
 col=mix(col,vec3(.94,.82,.73),gaussian(length((p-vec2(95.,75.))/vec2(1.5,1.0)),350.)*.15);
 return col;
}
vec3 tint(float i){
 if(i<.5)return vec3(.97,.99,1.);
 if(i<1.5)return vec3(.43,.19,.94);
 if(i<2.5)return vec3(.13,.78,.72);
 if(i<3.5)return vec3(.50,.92,.93);
 if(i<4.5)return vec3(.98,.96,.96);
 if(i<5.5)return vec3(.31,.23,.99);
 if(i<6.5)return vec3(.89,.94,.96);
 if(i<7.5)return vec3(.97,.94,1.);
 return vec3(.85,.61,.92);
}
float depth(float i){ if(i<.5)return 3.0; if(i==1.||i==2.)return 15.;if(i==3.||i==8.)return 9.;if(i==5.||i==6.)return 13.;return 6.; }
vec3 shade(vec3 base,vec2 p,int i,float sd,vec3 under){
 float style=props[i].y;
 float radius=props[i].x;
 vec2 center=objs[i].xy;
 vec2 hs=objs[i].zw*.5;
 // Near the polished bevel, the surface tilts toward the perimeter.
 vec2 q=clamp((p-center)/hs,-1.,1.);
 vec2 a=abs(p-center);
 float flat=min(min(hs.x-a.x,hs.y-a.y),-sd);
 vec2 nxy=normalize(q+vec2(.0001)) * pow(1.-smoothstep(0.,13.,-sd),1.5);
 float faceHeight=depth(style);
 vec3 N=normalize(vec3(nxy*.80,1.));
 vec3 V=normalize(vec3(.04,-.05,1.));
 float fresnel=.045+.955*pow(1.-max(dot(N,V),0.),5.);
 vec3 S=normalize(vec3(sun*.8,1.4));
 vec3 R=reflect(-V,N);
 float spec=pow(max(dot(R,S),0.), style==1.||style==2.?46.:78.);
 float specSmall=pow(max(dot(R,normalize(vec3(.56,-.27,1.))),0.),90.);
 float rim=exp(-max(-sd,0.)*.28);
 float inner=exp(-max(-sd,0.)*.07);
 float directional=clamp(dot(N,S)*.5+.5,0.,1.);
 float topLeft=clamp(dot(nxy,vec2(-.65,-.76)),0.,1.);
 float bottomRight=clamp(dot(nxy,vec2(.72,.72)),0.,1.);
 // Snell-inspired shift, sampled against the lit environment below the glass.
 vec2 shift=nxy*(1.5+10.*rim)+vec2(1.,-2.);
 vec3 through=backdrop(p+shift);
 vec3 color=through;
 float colorAmt=style==1.||style==2.?.76:style==3.?.27:style==8.?.44:.13;
 color=mix(color,base,colorAmt);
 if(style==0.)color=mix(under,vec3(.95,.97,1.),.065);
 if(style==4.||style==6.)color=mix(color,vec3(.99,.967,.95),.75);
 if(style==7.)color=mix(under,vec3(.96,.93,.95),.19);
 // Directional reflections rather than a diffuse oval at the bottom.
 vec3 reflected=mix(vec3(.97,.94,.94),vec3(.43,.60,.72),clamp(.45+.5*R.y+.2*R.x,0.,1.));
 color=mix(color,reflected,fresnel*(style==0.?.28:.48));
 color+=vec3(.94,.98,1.)*spec*(style==1.||style==2.?.32:.48);
 color+=vec3(.65,.89,1.)*specSmall*.11;
 color+=vec3(1.)*rim*(.045+.17*topLeft);
 color-=vec3(.19,.24,.26)*rim*.20*bottomRight;
 if(style==1.||style==2.){
  float bottomLine=gaussian(sd+2.5,3.5)*bottomRight;
  color+=vec3(1.)*bottomLine*.14;
  float moving=gaussian((p.x-center.x)/hs.x-.20*sin(time*.55+float(i)),.22);
  color+=vec3(1.)*moving*rim*.055;
 }
 if(style==3.||style==8.){
  float irid=sin(p.x*.024-p.y*.016+time*.30)*.5+.5;
  color+=mix(vec3(.27,.83,.88),vec3(.84,.40,.99),irid)*rim*.18;
  color+=vec3(.16,.33,.38)*gaussian(length((p-(center+vec2(hs.x*.68,hs.y*.63)))*vec2(1.15,1.0)),37.)*.38;
 }
 if(style==8.){
  float nx=(p.x-(center.x-hs.x))/(hs.x*2.);
  float ny=(p.y-(center.y-hs.y))/(hs.y*2.);
  vec3 pastel=mix(vec3(1.,.76,.72),vec3(.47,.84,.96),clamp(nx*.67+ny*.30,0.,1.));
  color=mix(color,pastel,.52);
 }
 return clamp(color,0.,1.5);
}
void main(){
 float scale=min(res.x/650.,res.y/760.);
 P=vec2(309.5+(gl_FragCoord.x-res.x*.5)/scale,355.5+(res.y*.5-gl_FragCoord.y)/scale);
 vec3 color=backdrop(P);
 // backdrop shadow below whole kit, soft and directional from left upper sunlight
 float dboard=sdItem(P-vec2(14.,27.),0);
 color*=1.-.37*(1.-smoothstep(-12.,46.,dboard));
 for(int i=0;i<N;i++){
  float sd=sdItem(P,i);
  float sty=props[i].y;
  if(i>0){
   vec2 offset=vec2(9.+depth(sty)*.48,13.+depth(sty)*.82);
   float shadow=sdItem(P-offset,i);
   float a=(1.-smoothstep(-4.,24.,shadow))*(sty==1.||sty==2.?.39:.17);
   color=mix(color,color*vec3(.29,.34,.42),a);
  }
  float mask=1.-smoothstep(-.9,1.25,sd);
  if(mask>0.){
   vec3 base=tint(sty);
   vec3 outc=shade(base,P,i,sd,color);
   color=mix(color,outc,mask);
   // screen-space thin sunlit meniscus, strongest on near edge
   float rim=gaussian(sd,1.3);
   color+=rim*.12*vec3(1.,1.,1.);
  }
 }
 float interactiveGlow=exp(-pow(length(P-touched)/72.,2.))*clickPulse*.05;
 color+=vec3(.5,.5,1.)*interactiveGlow;
 // translucent white sunlight at upper left, no milky fog over controls
 color+=vec3(.09,.07,.048)*(1.-smoothstep(0.,420.,length(P-vec2(-60.,-70.))));
 color=pow(max(color,vec3(0.)),vec3(.94));
 outColor=vec4(color,1.);
}
</script>
