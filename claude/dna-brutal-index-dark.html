<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DNA // Brutal Index / Command Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--p:#0b0b0a;background:var(--p);color-scheme:dark}
html,body{margin:0;height:100%;background:var(--p);overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
(async()=>{
  const paths=["command-deck-parts/part-01.js","command-deck-parts/part-02.js","command-deck-parts/part-03.js","command-deck-parts/part-04.js","command-deck-parts/part-05.js","command-deck-parts/part-06.js","command-deck-parts/part-07.js","command-deck-parts/part-08.js","command-deck-parts/part-09.js","command-deck-parts/part-10.js"];
  try {
    const parts=await Promise.all(paths.map(async path=>{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw new Error(path+' HTTP '+r.status);return r.text()}));
    const script=document.createElement('script');script.textContent=parts.join('');document.body.appendChild(script);
  } catch(error) {console.error('DNA Command Deck failed to load',error);document.body.insertAdjacentText('beforeend','Unable to load Command Deck scripts. Refresh or check the network.');}
})();
</script></body></html>
