 ag.forEach((a,i)=>{const yy=y+i*rh,on=i==hi,ty=yy+rh/2+4;if(rnd()<.004){a.s=ST[rnd()*ST.length|0];a.tl=rnd()}a.l+=(a.tl-a.l)*.02;

  const ex=x+w*.79,ew=w*.21,pts=[];for(let p=0;p<=ew;p+=2)pts.push([ex+p,yy+rh/2-ecg(t*(.6+a.l)+a.ph-p/ew*1.5)*rh*.34]);ln(pts,c,1.5);

 dx(String(72+(Math.sin(t)*4|0)),x,y+28,32,fg);tx('BPM / SYNC '+(99+Math.sin(t)*.4).toFixed(1)+'%',x+60,y+16,10,'left',1,fg,.8)}

function pRadar(x,y,w,h){const cx=x+w/2,cy=y+h/2,r=Math.max(10,Math.min(w,h)/2-4),a=t*1.5;g.strokeStyle=fg;g.lineWidth=2;for(let k=1;k<=3;k++){g.globalAlpha=k==3?1:.35;g.beginPath();g.arc(cx,cy,r*k/3,0,TAU);g.stroke()}g.globalAlpha=.35;ln([[cx-r,cy],[cx+r,cy]],fg,1);ln([[cx,cy-r],[cx,cy+r]],fg,1);

function pGauge(x,y,w,h){const cx=x+w/2,cy=y+h*.82,r=Math.max(10,Math.min(w/2-6,h*.7)),v=.5+.4*Math.sin(t*.9);g.lineWidth=10;g.strokeStyle=fg;g.globalAlpha=.2;g.beginPath();g.arc(cx,cy,r,Math.PI,TAU);g.stroke();g.globalAlpha=1;g.beginPath();g.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*v);g.stroke();

function pGen(x,y,w,h){const cs=15,cl=Math.floor(w/cs),rw=Math.floor(h/cs),sc=Math.floor(t*6)%cl;for(let i=0;i<cl;i++)for(let j=0;j<rw;j++){const k=i*31+j*17+(t*1.5|0),v=((i*7+j*13+(t*3|0))*2654435761>>>0)%100,on=i==sc||v<8,px=x+i*cs,py=y+j*cs;

function pTask(x,y,w,h){const rh=h/5;TK.forEach((k,i)=>{k.p+=k.s;if(k.p>1)k.p=0;const yy=y+i*rh;tx(String(i+1).padStart(2,'0')+' '+k.n,x,yy+10,10,'left',1);tx((k.p*100|0)+'%',x+w,yy+10,10,'right',1,OR);g.strokeStyle=fg;g.lineWidth=2;g.strokeRect(x+1,yy+14,w-2,9);g.fillStyle=fg;g.fillRect(x+3,yy+16,(w-6)*k.p,5);g.fillStyle=OR;g.fillRect(x+3+(w-6)*k.p-4,yy+16,4,5)})}

 if(W<760){const p=6,bh=y1-y0-p*2;let y=y0+p;[['net',.22],['agents',.25],['helix',.14],['pulse',.12],['stat',.11],['log',.16]].forEach(([n,f])=>{L.push([n,p,y,W-p*2,bh*f]);y+=bh*f});return L}
