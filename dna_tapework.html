function reel(cx,cy,r,angle,fillPercent,reverse=false){
 const p=C();ctx.save();ctx.translate(cx,cy);ctx.rotate(angle*(reverse?-1:1));
 for(let j=0;j<10;j++){
 const rr2=r-j*3;ctx.strokeStyle=j%3===0?p.line:p.low;ctx.lineWidth=j%3===0?3:1;
 ctx.beginPath();ctx.arc(0,0,rr2,0,TAU);ctx.stroke();
 }
 ctx.strokeStyle=p.muted;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*.68,0,TAU);ctx.stroke();
 for(let i=0;i<6;i++){
 ctx.save();ctx.rotate(i*TAU/6);
 fill(r*.22,-8,r*.52,16,i%2?p.surface2:p.line,5);
 fill(r*.40,-3,r*.27,6,p.main,2);
 ctx.restore();}
 ctx.rotate(-angle*.65);fill(-20,-20,40,40,p.bg,6);stroke(-20,-20,40,40,p.main,6,2);
 txt(reverse?'O':'I',0,6,22,p.ink,'bold','center');ctx.restore();
 txt(`${Math.round(fillPercent)}%`,cx,cy+r+39,12,p.second,'bold','center');
}

 ctx.save();ctx.globalAlpha=.62;
 line(m.x-9,m.y,m.x-3,m.y,p.main);line(m.x+3,m.y,m.x+9,m.y,p.main);
 line(m.x,m.y-9,m.x,m.y-3,p.main);line(m.x,m.y+3,m.x,m.y+9,p.main);
 ctx.restore()
}
function modalRender(){const p=C();const v=state.modalOpen;if(v<.02)return;
 ctx.save();ctx.globalAlpha=v;fill(0,0,VW,VH,'rgba(0,0,0,.86)');
 // Industrial shutter edges, not a frosted glass card.
 const bx=340,by=170,bw=920,bh=620;
 fill(bx,by,bw,bh,p.surface);stroke(bx,by,bw,bh,p.main,0,2);
 fill(bx,by,17,bh,p.main);
 for(let i=0;i<14;i++)fill(bx+17+i*14,by+8,6,6,p.line);
 txt('DNA / INSPECTION SHEET',bx+45,by+52,27,p.ink,'bold','left','sans-serif');
 txt(state.modal?.type==='stage'?'PROCESS CONTRACT / EVIDENCE':'RUN RECORD / AUDIT TRAIL',bx+45,by+79,13,p.main,'bold');
 const item=state.modal?(state.modal.type==='stage'?stages[state.modal.index]:jobs[state.modal.index||0]):null;
 if(item){
  txt(item.title||item.id,bx+45,by+138,37,p.main,'bold','left','sans-serif');
  txt(item.detail||item.name,bx+45,by+176,16,p.ink);
  line(bx+45,by+208,bx+bw-45,by+208,p.line);
  txt('OPERATION CHECKLIST',bx+45,by+245,14,p.second,'bold');
  const tasks=state.modal.type==='stage'?item.checks:['Task registered','Worker assigned','Artifacts materialized','Acceptance verified'];
  tasks.forEach((task,i)=>{
   const done=state.modal.type==='stage'?i<2:(item.check[i]===1);
   let ry=by+272+i*55;
   fill(bx+45,ry,35,35,done?p.second:p.low);
   txt(done?'✓':'—',bx+62,ry+25,22,done?p.bg:p.muted,'bold','center');
   txt(task,bx+100,ry+24,17,done?p.ink:p.muted);
  });
  txt(state.modal.type==='stage'?'EVENT CONTRACT ID / '+String(state.modal.index+1).padStart(2,'0'):'PROGRESS '+Math.round(item.progress)+'% / '+number(item.tokens)+' TOKENS',bx+45,by+542,13,p.main);
 }
 button('CLOSE [ESC]',bx+bw-185,by+547,140,45,()=>closeModal(),true);
 ctx.restore();
}
function showModal(type,index){state.modal={type,index};state.selectedStage=index;state.modalOpen=.001;state.typedFocus=false}
function closeModal(){state.modal=null}
function pushEvent(msg,kind='info'){
 state.events.unshift({msg,kind,time:state.simClock});if(state.events.length>70)state.events.length=70;
}
function tokenPrint(amount){
 state.tokenTotal+=amount;current().tokens+=amount;state.recentBurn=amount;
 for(let i=0;i<Math.min(95,Math.max(2,Math.round(Math.sqrt(amount)*1.7)));i++){
   state.flakes.push({x:740+Math.random()*140,y:786,dy:1+Math.random()*2,life:50+Math.random()*70,a:Math.random()*.75+.1});
 }
}
function stepEvent(){
 if(state.jam)return pushEvent('BLOCKED / TRANSPORT RECOVERY REQUIRED','warn');
 state.evtIndex++;
 const j=current();
 const amount=90+((state.evtIndex*137)%680);tokenPrint(amount);
 state.processed=Math.min(100000,state.processed+((state.evtIndex*13)%110)+22);
 state.throughput=54+(state.evtIndex*13)%83;
 state.scan=(state.scan+.047+(state.evtIndex%3)*.017)%1;
 if(j.progress<100){j.progress=Math.min(100,j.progress+(state.evtIndex%3===0?2:1));j.phase=Math.min(5,Math.floor(j.progress/18));if(j.progress>=100){j.status='DONE';j.phase=5;}}
 const events=['WORKER ACK / SHARD RETURNED','TOKEN LEDGER / CHARGED','CODE PATCH / STAGED','VERIFIER / CONTRACT MATCH','MEMORY WRITE / CHECKPOINT','SCHEDULER / CALLBACK WAKE','TOOL PERMIT / CONFIRMED'];
 pushEvent(j.id+' / '+events[state.evtIndex%events.length]);
}
function addJob(){idCounter++;if(jobs.length>=8)jobs.splice(0,1);jobs.push({id:'RUN-'+String(idCounter).padStart(3,'0'),name:['Build semantic test fixtures','Assemble pipeline contracts','Repair agent route table','Inspect output artifacts'][idCounter%4],phase:0,progress:0,tokens:0,tests:'00/10',status:'QUEUED',check:[1,0,0,0]});state.selected=jobs.length-1;pushEvent('OPERATOR / NEW RUN INSERTED '+current().id)}
function toggle(){state.run=!state.run;pushEvent(state.run?'TRANSPORT / ENGAGED':'TRANSPORT / HELD')}
function fault(){state.jam=true;state.run=false;pushEvent('!!! FAULT / READ HEAD OBSTRUCTED','warn')}
function recover(){state.jam=false;state.run=true;pushEvent('RECOVERY / READ HEAD RECALIBRATED')}
function cycleTheme(){themeIndex=(themeIndex+1)%palettes.length;pushEvent('OPERATOR / PHOSPHOR PROFILE '+C().name)}
function command(raw){const [c,...rest]=raw.trim().toLowerCase().split(/\s+/);if(!c)return;pushEvent('> '+raw);
 switch(c){case 'help':pushEvent('COMMANDS / run hold step job fault repair skin inspect');break;
 case 'run':state.run=true;break;case 'hold':state.run=false;break;
 case 'step':stepEvent();break;case 'job':addJob();break;
 case 'fault':fault();break;case 'repair':recover();break;
 case 'skin':cycleTheme();break;case 'inspect':showModal('job',state.selected);break;
 case 'status':pushEvent(`${current().id} / ${current().status} / ${Math.round(current().progress)}%`);break;
 default:pushEvent('UNKNOWN OPERATOR COMMAND / TYPE HELP','warn');
 }}
function eventsUpdate(dt){
 if(state.run&&!state.jam){state.simClock+=dt;state.rotation+=dt*(state.throughput/55);state.tapePhase+=dt*state.throughput*.55;state.scan=(state.scan+dt*.11)%1;state.lastEvent+=dt;
  if(state.lastEvent>1.30){state.lastEvent=0;stepEvent()}
 }
 state.flakes=state.flakes.filter(f=>{f.y+=f.dy;f.x+=Math.sin(state.t*.001+f.y*.07)*.2;f.life-=1;return f.life>0&&f.y<880});
 state.modalOpen+=((state.modal?1:0)-state.modalOpen)*Math.min(1,dt*10);
 if(state.modal&&!state.modalOpen)state.modalOpen=.001;
}
function viewport(){dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
 scale=Math.min(innerWidth/VW,innerHeight/VH);offsetX=(innerWidth-VW*scale)/2;offsetY=(innerHeight-VH*scale)/2;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
function toWorld(e){return{x:(e.clientX-offsetX)/scale,y:(e.clientY-offsetY)/scale}}
canvas.addEventListener('pointermove',e=>{state.mouse=toWorld(e);const h=[...slots].reverse().find(a=>state.mouse.x>=a.x&&state.mouse.x<=a.x+a.w&&state.mouse.y>=a.y&&state.mouse.y<=a.y+a.h);state.hover=h?h.id:null;canvas.style.cursor=h?'pointer':'crosshair'});
canvas.addEventListener('pointerleave',()=>{state.mouse={x:-40,y:-40}});
canvas.addEventListener('pointerdown',e=>{const m=toWorld(e);canvas.focus();if(state.modal){let close=slots.slice().reverse().find(a=>a.id==='btn:CLOSE [ESC]'&&m.x>=a.x&&m.x<a.x+a.w&&m.y>=a.y&&m.y<a.y+a.h);if(close)close.fn();else if(m.x<340||m.x>1260||m.y<170||m.y>790)closeModal();return;}
 const h=[...slots].reverse().find(a=>m.x>=a.x&&m.x<=a.x+a.w&&m.y>=a.y&&m.y<=a.y+a.h);if(h)h.fn();else state.typedFocus=false;
});
window.addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown'].includes(e.code)&&document.activeElement===canvas)e.preventDefault();
 if(e.key==='Escape'){closeModal();state.typedFocus=false;return}
 if(state.modal)return;
 if(state.typedFocus){if(e.key==='Enter'){command(state.typed);state.typed=''}else if(e.key==='Backspace')state.typed=state.typed.slice(0,-1);else if(e.key.length===1&&state.typed.length<120&&!e.ctrlKey&&!e.metaKey)state.typed+=e.key;return}
 if(e.code==='Space')toggle();else if(e.key.toLowerCase()==='s')stepEvent();else if(e.key.toLowerCase()==='f')fault();else if(e.key.toLowerCase()==='r')recover();else if(e.key.toLowerCase()==='n')addJob();else if(e.key==='`')state.typedFocus=true;
});
window.addEventListener('resize',viewport);
function draw(t){const dt=Math.min(.06,(t-last)/1000);last=t;state.t=t;eventsUpdate(dt);
 ctx.setTransform(dpr,0,0,dpr,0,0);fill(0,0,innerWidth,innerHeight,C().bg);
 ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);
 slots.length=0;back();header();library();machine();stagesPanel();bottomDeck();teletype();floor();
 // Additional material coming off the token press as receipt chips.
 state.flakes.forEach(f=>{ctx.globalAlpha=Math.min(.8,f.life/45)*f.a;fill(f.x,f.y,2+f.a*3,5,C().hot)});ctx.globalAlpha=1;
 trail();modalRender();requestAnimationFrame(draw)
}
viewport();
['BOOT / TAPE DECK SPIN-UP COMPLETE','SCHEDULER / EVENT CALLBACKS ARMED','VERIFY / ACCEPTANCE CONTACT SHEET READY','MEMORY / CHECKPOINT CHANNEL ONLINE'].forEach(msg=>pushEvent(msg));
requestAnimationFrame(draw);
})();
</script>
